name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm --prefix frontend audit --audit-level=high

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen --package resume

      - name: Run tests
        run: pnpm --prefix frontend test:run

      - name: Build site (includes resume generation)
        env:
          SITE_URL: https://www.alexandermcintosh.com
          PUBLIC_API_URL: https://api.alexandermcintosh.com
        run: |
          pnpm --prefix frontend generate-resume
          pnpm --prefix frontend astro build --site "$SITE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Agent Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/agent/Dockerfile
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mcintalmo/mcintalmo.github.io/agent:latest

      - name: Build and Push Auth Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/auth/Dockerfile
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mcintalmo/mcintalmo.github.io/auth:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-backend:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
    env:
      SEC_LIST_ID: ${{ vars.OCI_SEC_LIST_ID }}
      VM_IP: ${{ vars.OCI_VM_IP }}
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and Configure OCI CLI
        run: |
          pipx install oci-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf "[DEFAULT]\nuser=${{ secrets.OCI_USER_OCID }}\nfingerprint=${{ secrets.OCI_FINGERPRINT }}\nkey_file=/home/runner/.oci/key.pem\ntenancy=${{ secrets.OCI_TENANCY_OCID }}\nregion=us-chicago-1\n" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Whitelist Runner IP
        id: whitelist
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me || curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

          # Fetch current ingress rules
          CURRENT_RULES=$(oci network security-list get --security-list-id "${{ env.SEC_LIST_ID }}" --query "data.\"ingress-security-rules\"")
          echo "ORIGINAL_RULES<<EOF" >> $GITHUB_ENV
          echo "$CURRENT_RULES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Add new rule
          NEW_RULE=$(jq -n --arg ip "$RUNNER_IP" '{protocol: "6", source: ($ip + "/32"), sourceType: "CIDR_BLOCK", tcpOptions: {min: 22, max: 22}, stateless: false, description: "GitHub Actions temporary SSH access"}')
          NEW_RULES=$(echo "$CURRENT_RULES" | jq --argjson rule "$NEW_RULE" '. + [$rule]')

          # Apply new rules
          oci network security-list update --security-list-id "${{ env.SEC_LIST_ID }}" --ingress-security-rules "$NEW_RULES" --force

      - name: Deploy to OCI VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          set -e
          # Give OCI a few seconds to propagate security list rules
          sleep 5

          # Set up SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH private key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Populate known_hosts with retries
          for i in {1..5}; do
            ssh-keyscan -t ed25519,rsa -H "${{ env.VM_IP }}" >> ~/.ssh/known_hosts && break || {
              echo "ssh-keyscan failed, retrying in 3 seconds..."
              sleep 3
            }
          done

          # Test SSH connection
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=5 ubuntu@${{ env.VM_IP }} "echo 'SSH connection successful!'"

          # Sync files
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --exclude 'node_modules' --exclude '.git' --exclude '.venv' --exclude 'dist' --exclude '.astro' --exclude 'backend/.env' ./ ubuntu@${{ env.VM_IP }}:/home/ubuntu/mcintalmo.github.io/

          # Inject SMTP secrets into remote .env file on OCI VM
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ env.VM_IP }} "
            cd /home/ubuntu/mcintalmo.github.io &&
            touch .env &&
            sed -i \"/^ENVIRONMENT=/d\" .env &&
            echo \"ENVIRONMENT=production\" >> .env &&
            for var in SMTP_SMARTHOST SMTP_AUTH_USERNAME SMTP_PASSWORD ALERT_DESTINATION_EMAIL; do
              sed -i \"/^\${var}=/d\" .env
            done &&
            echo \"SMTP_SMARTHOST=${{ secrets.SMTP_SMARTHOST }}\" >> .env &&
            echo \"SMTP_AUTH_USERNAME=${{ secrets.SMTP_AUTH_USERNAME }}\" >> .env &&
            echo \"SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}\" >> .env &&
            echo \"ALERT_DESTINATION_EMAIL=${{ secrets.ALERT_DESTINATION_EMAIL }}\" >> .env &&
            chmod 600 .env
          "

          # Inject LLM secrets into remote backend/.env file on OCI VM
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ env.VM_IP }} "
            cd /home/ubuntu/mcintalmo.github.io/backend &&
            touch .env &&
            sed -i \"/^ENVIRONMENT=/d\" .env &&
            echo \"ENVIRONMENT=production\" >> .env &&
            sed -i \"/^OLLAMA_MODEL_NAME=/d\" .env &&
            echo \"OLLAMA_MODEL_NAME=${{ vars.OLLAMA_MODEL_NAME || 'qwen2.5:3b' }}\" >> .env &&
            if [ -n \"${{ secrets.CEREBRAS_API_KEY }}\" ]; then
              sed -i \"/^CEREBRAS_API_KEY=/d\" .env
              echo \"CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.OPENROUTER_API_KEY }}\" ]; then
              sed -i \"/^OPENROUTER_API_KEY=/d\" .env
              echo \"OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.GITHUB_API_KEY }}\" ]; then
              sed -i \"/^GITHUB_API_KEY=/d\" .env
              echo \"GITHUB_API_KEY=${{ secrets.GITHUB_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.NVIDIA_API_KEY }}\" ]; then
              sed -i \"/^NVIDIA_API_KEY=/d\" .env
              echo \"NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.CARTESIA_API_KEY }}\" ]; then
              sed -i \"/^CARTESIA_API_KEY=/d\" .env
              echo \"CARTESIA_API_KEY=${{ secrets.CARTESIA_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.LIVEKIT_API_KEY }}\" ]; then
              sed -i \"/^LIVEKIT_API_KEY=/d\" .env
              echo \"LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.LIVEKIT_API_SECRET }}\" ]; then
              sed -i \"/^LIVEKIT_API_SECRET=/d\" .env
              echo \"LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}\" >> .env
            fi &&
            if [ -n \"${{ secrets.LIVEKIT_API_KEY }}\" ] && [ -n \"${{ secrets.LIVEKIT_API_SECRET }}\" ]; then
              sed -i \"/^LIVEKIT_KEYS=/d\" .env
              echo \"LIVEKIT_KEYS=${{ secrets.LIVEKIT_API_KEY }}: ${{ secrets.LIVEKIT_API_SECRET }}\" >> .env
            fi &&
            chmod 600 .env
          "

          # Clean up unused images and build cache before pulling to prevent disk-full failures
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ env.VM_IP }} "docker image prune -af && docker builder prune -af"

          # Pull pre-compiled GHCR images and restart services
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ env.VM_IP }} "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            sed -i '/rtc:/a \  node_ip: ${{ env.VM_IP }}' /home/ubuntu/mcintalmo.github.io/infra/livekit.yaml &&
            if [ -n '${{ secrets.LIVEKIT_API_KEY }}' ] && [ -n '${{ secrets.LIVEKIT_API_SECRET }}' ]; then
              sed -i '/keys:/ {n; d}' /home/ubuntu/mcintalmo.github.io/infra/livekit.yaml &&
              sed -i '/keys:/a \  ${{ secrets.LIVEKIT_API_KEY }}: ${{ secrets.LIVEKIT_API_SECRET }}' /home/ubuntu/mcintalmo.github.io/infra/livekit.yaml
            fi &&
            sudo cp /home/ubuntu/mcintalmo.github.io/infra/nginx/portfolio.conf /etc/nginx/sites-available/portfolio.conf &&
            sudo nginx -t &&
            sudo systemctl reload nginx &&
            cd /home/ubuntu/mcintalmo.github.io/infra &&
            docker compose --profile telemetry pull agent auth &&
            docker compose --profile telemetry up -d &&
            docker compose restart livekit
          "

      - name: Revoke Whitelist
        if: always()
        run: |
          if [ -n "$ORIGINAL_RULES" ]; then
            oci network security-list update --security-list-id "${{ env.SEC_LIST_ID }}" --ingress-security-rules "$ORIGINAL_RULES" --force
          fi
