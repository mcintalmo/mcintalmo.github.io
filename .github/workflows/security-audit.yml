name: Continuous Security & Health Audit

on:
  schedule:
    # Daily at 06:00 UTC (01:00 AM Central)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Frontend Dependencies
        run: pnpm --prefix frontend audit --audit-level=high

      - name: Probe TLS, Reverse Proxy Headers, and Dependabot Baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/security_audit.py --check-dependabot
