name: Run DeepEval Evaluations

on:
  workflow_dispatch:
    inputs:
      openai_api_key:
        description: "OpenAI API Key"
        required: true
        type: string
      nvidia_api_key:
        description: "NVIDIA API Key"
        required: true
        type: string

concurrency:
  group: deepeval-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Run Tailoring Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run DeepEval test suite
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ github.event.inputs.openai_api_key || secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ github.event.inputs.nvidia_api_key || secrets.NVIDIA_API_KEY }}
        run: |
          uv run deepeval test run tailor/tests/evals/test_tailor.py
