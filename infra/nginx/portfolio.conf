limit_req_zone $binary_remote_addr zone=token_limit:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

# ── API: Redirect HTTP to HTTPS ──────────────────────────────────────────────
server {
    listen 80;
    server_name api.alexandermcintosh.com;
    return 301 https://$host$request_uri;
}

# ── API: HTTPS Reverse Proxy ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.alexandermcintosh.com;

    ssl_certificate /etc/letsencrypt/live/api.alexandermcintosh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alexandermcintosh.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self 'https://livekit.alexandermcintosh.com'), camera=()" always;

    location /token {
        limit_req zone=token_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── LiveKit: Redirect HTTP to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name livekit.alexandermcintosh.com;
    return 301 https://$host$request_uri;
}

# ── LiveKit: HTTPS / WSS Reverse Proxy ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name livekit.alexandermcintosh.com;

    ssl_certificate /etc/letsencrypt/live/livekit.alexandermcintosh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.alexandermcintosh.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
