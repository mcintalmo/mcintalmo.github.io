# Gitleaks configuration file
# Ref: https://github.com/gitleaks/gitleaks

[allowlist]
description = "Global repository allowlist for mock, test, and placeholder keys"
paths = [
  '''pnpm-lock\.yaml''',
  '''uv\.lock''',
  '''\.env\.example''',
  '''frontend/src/content/.*''',
  '''resume/.*''',
  '''infra/.*\.yaml''',
  '''backend/.*/tests/.*''',
]
regexes = [
  '''local-key''',
  '''devkey''',
]
