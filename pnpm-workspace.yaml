packages:
  - frontend
# Security hardening configuration
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
blockExoticSubdeps: true
overrides:
  astro@<7.0.6: ^7.0.6
  astro@<7.2.8: ^7.2.8
  astro@<=7.2.3: ^7.2.4
  astro@>=2.9.0 <=7.0.9: ^7.1.0
  astro@>=3.10.0 <7.0.4: ^7.0.4
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  devalue@<=5.9.2: ^5.9.4
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@<3.1.7: ^3.1.7
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  sharp@<0.35.0: ^0.35.0
  sharp@<0.35.4: ^0.35.4
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=8.0.0 <8.10.2: ^8.10.2
minimumReleaseAgeExclude:
  - '@astrojs/react@6.0.6'
  - 'brace-expansion'
  - 'fast-uri'
  - 'undici'
  - 'devalue'
allowBuilds:
  '@sentry/cli': true
  esbuild: true
